[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sampleshard"
version = "0.1.0"
description = "SampleShard - Training sample storage format"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Neumenon", email = "oss@neumenon.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["machine-learning", "dataset", "shard", "training"]
requires-python = ">=3.9"
dependencies = [
    "cowrie-py>=0.1.1",
]

[project.optional-dependencies]
compression = [
    "zstandard>=0.20.0",
    "lz4>=4.0.0",
]
hash = [
    "xxhash>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
all = [
    "sampleshard[compression,hash,dev]",
]

[project.urls]
Homepage = "https://github.com/Neumenon/cowrie"
Documentation = "https://github.com/Neumenon/cowrie/tree/main/sampleshard-py"
Repository = "https://github.com/Neumenon/cowrie"
Issues = "https://github.com/Neumenon/cowrie/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sampleshard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
